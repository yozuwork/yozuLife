<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>YozuLife</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500&family=Noto+Serif+TC:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/v2/style.css">
</head>
<body style="visibility:hidden">

<!-- Desktop sidebar -->
<aside class="side" aria-label="主選單">
  <p class="logo"><span class="seed" aria-hidden="true"></span>YozuLife</p>
  <ul>
    <li><a href="#life" data-tab="life"><span data-icon="life"></span>LIFE區</a></li>
    <li><a href="#hero" data-tab="hero"><span data-icon="hero"></span>習慣Hero</a></li>
  </ul>
  <p class="foot" data-version></p>
</aside>

<main>
  <div class="wrap">
    <div class="account" aria-label="帳號">
      <div class="account-info">
        <span id="account-name">確認登入狀態中…</span>
        <span class="account-status" id="account-status" role="status" aria-live="polite">分區設定儲存於此瀏覽器</span>
      </div>
      <button class="account-button" id="account-action" type="button" disabled>載入中…</button>
    </div>

    <!-- LIFE -->
    <section class="view" id="view-life" aria-labelledby="t-life">
      <h1 id="t-life" class="vh">LIFE區</h1>

      <div class="toolbar">
      <div class="search" role="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>
        <label for="q" class="vh">搜尋分區</label>
        <input id="q" type="search" placeholder="搜尋分區" autocomplete="off" enterkeyhint="search">
        <button class="clear" id="clear" hidden aria-label="清除搜尋">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"/></svg>
        </button>
      </div>
      </div>

      <div class="chips" id="chips" role="group" aria-label="分類"></div>
      <p class="sort-hint">拖曳卡片可調整順序；手機請拖曳右下角把手。鍵盤可按 Alt＋方向鍵排序。</p>

      <div class="sections-heading"><h2>全部分區 <small id="section-total"></small></h2><button class="tidy" id="add-section" type="button">＋ 新增分區</button></div>

      <div id="groups"></div>
    </section>

    <!-- 習慣Hero -->
    <section class="view" id="view-hero" aria-labelledby="t-hero" hidden>
      <h1 id="t-hero" class="vh">習慣Hero</h1>
      <div class="placeholder">
        <div>
          <svg class="art" viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="60" cy="60" r="52" stroke-dasharray="3 7" opacity=".45"/>
            <path d="M60 26l26 10v20c0 17-11 29-26 36-15-7-26-19-26-36V36l26-10z" fill="var(--yuzu-wash)"/>
            <path d="M60 44l5 10 11 1.5-8 7.5 2 11-10-5.5-10 5.5 2-11-8-7.5 11-1.5z"/>
          </svg>
          <h3>習慣Hero 還在準備中</h3>
          <p>之後會在這裡養成每天的好習慣。</p>
        </div>
      </div>
    </section>
    <footer class="site-footer">YozuLife <span data-version></span></footer>
  </div>
</main>

<dialog id="section-dialog" aria-labelledby="section-dialog-title">
  <form id="section-form">
    <h2 id="section-dialog-title">新增分區</h2>
    <label for="section-name">分區名稱</label>
    <input id="section-name" name="name" required maxlength="40" placeholder="例如：閱讀清單">
    <label for="section-group">分類</label>
    <input id="section-group" name="group" list="section-groups" required maxlength="20" placeholder="選擇或輸入新分類">
    <datalist id="section-groups"></datalist>
    <label for="section-icon">圖示</label>
    <select id="section-icon" name="icon">
      <option value="life">生活</option><option value="hero">目標</option>
      <option value="transit">卡片</option><option value="calendar">日曆</option><option value="subscription">訂閱</option>
    </select>
    <div class="bootstrap-picker">
      <label for="icon-search">Bootstrap Icons</label>
      <input id="icon-search" type="search" placeholder="搜尋圖示，例如 heart、book、醫療" autocomplete="off">
      <p id="icon-selection" class="icon-selection" aria-live="polite">目前使用：生活</p>
      <div id="icon-grid" class="icon-grid" role="group" aria-label="Bootstrap 圖示選擇"></div>
      <button id="icon-more" class="icon-more" type="button">顯示更多圖示</button>
      <p id="icon-count" class="icon-count" role="status"></p>
    </div>
    <label for="section-color">顏色</label>
    <input id="section-color" name="color" type="color" value="#4f6b47">
    <p id="section-message" role="status" aria-live="polite"></p>
    <div class="dialog-actions"><button id="section-cancel" type="button">取消</button><button class="tidy" type="submit">新增分區</button></div>
  </form>
</dialog>

<!-- Mobile bottom nav -->
<nav class="nav" aria-label="主選單">
  <ul>
    <li><a href="#life" data-tab="life" aria-label="LIFE區"><span data-icon="life"></span></a></li>
    <li><a href="#hero" data-tab="hero" aria-label="習慣Hero"><span data-icon="hero"></span></a></li>
    <li><button id="mobile-account-action" class="mobile-account-action" type="button" disabled><i class="bi bi-person-circle" aria-hidden="true"></i><span>載入中…</span></button></li>
  </ul>
  <p id="mobile-account-status" class="mobile-account-status" role="status" aria-live="polite" hidden></p>
</nav>

<!-- Detail page -->
<article class="detail" id="detail" hidden aria-labelledby="d-title">
  <div class="d-bar">
    <button class="d-back" id="back" aria-label="返回 LIFE區">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <span class="d-bar-title" id="d-bar-title" aria-hidden="true"></span>
  </div>
  <div class="d-body">
    <div class="d-ic d-in" id="d-ic"></div>
    <h2 class="d-in" id="d-title"></h2>
    <p class="d-group d-in" id="d-group"></p>
    <div class="d-empty d-in">
      <strong>這個分區還是空的</strong>
      功能之後會放在這裡。
    </div>
    <div id="medical-content" hidden></div>
    <div id="maps-content" hidden></div>
  </div>
</article>

<script type="module" src="/src/v2/bootstrap.js"></script>
</body>
</html>
